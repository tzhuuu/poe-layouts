[workspace]
members = [
    "crates/pather-cli",
    "crates/pather-core",
    "crates/pather-layouts-server",
    "crates/pather-schema",
    "crates/poe-content",
    "crates/poe-dat",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[workspace.dependencies]
anyhow = "1.0.100"
blake3 = "1.8.2"
clap = "4.5.53"
flatbuffers = "25.9.23"
reqwest = { version = "0.12.26", default-features = false }
serde = "1.0.228"
serde_json = "1.0.145"
tempfile = "3.23.0"
thiserror = "2.0.17"
