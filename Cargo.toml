[workspace]
members = [
    "app/src-tauri",
    "crates/poe-schema",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[workspace.dependencies]
flatbuffers = "25.9.23"
thiserror = "2.0.17"
